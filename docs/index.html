<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HighGround: Hill Country Flood-Safe Stay Checker</title>
<style>
  /* ===== EDIT COLORS AND FONTS HERE ===== */
  :root {
    --paper: #f6f3ec; --surface: #fff; --ink: #1c2530; --soft: #55616d; --line: #ddd6c8;
    --river: #1f7a8c; --river-dark: #155766;
    --severe: #9b1c1c; --high: #c2410c; --elevated: #a16207; --lower: #3f6212;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); }
  h1, h2, h3 { font-family: var(--display); line-height: 1.2; margin: 0 0 .5rem; }
  a { color: var(--river-dark); }
  header { background: var(--ink); color: var(--paper); padding: 1rem 1.25rem; }
  header .inner, main { max-width: 1160px; margin: 0 auto; }
  .brand { font: 700 1.35rem var(--display); display: flex; gap: .5rem; align-items: center; }
  .tagline { color: #c3ccd5; font-size: .9rem; margin-top: .15rem; }
  main { padding: 1.5rem 1.25rem 3rem; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 1.5rem; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem 1.25rem; margin-bottom: 1rem; box-shadow: 0 2px 10px rgba(28,37,48,.05); }
  .intro h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
  .lead { color: var(--soft); margin: 0 0 1rem; }
  .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: .75rem; font-weight: 700; color: var(--river-dark); margin: 0 0 .3rem; }
  .small { font-size: .85rem; color: var(--soft); }
  .towns { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0 .75rem; }
  .towns button, .spot { font: inherit; cursor: pointer; }
  .towns button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: .3rem .8rem; }
  .towns button[aria-pressed="true"] { background: var(--river-dark); color: #fff; border-color: var(--river-dark); }
  svg.map { width: 100%; height: auto; display: block; background: #eef2f0; border-radius: 8px; }
  svg.map circle { cursor: pointer; stroke: #fff; stroke-width: 1.5; }
  svg.map circle.active { stroke: var(--ink); stroke-width: 3; }
  svg.map text { font: 600 13px var(--body); fill: var(--ink); paint-order: stroke; stroke: #eef2f0; stroke-width: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: .8rem; font-size: .8rem; margin-top: .5rem; color: var(--soft); }
  .legend span::before { content: ""; display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; background: var(--c); margin-right: .3rem; vertical-align: -1px; }
  .spots { list-style: none; padding: 0; margin: 0; max-height: 340px; overflow: auto; }
  .spot { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: .5rem; padding: .55rem .6rem; border: 0; border-bottom: 1px solid var(--line); background: none; }
  .spot:hover, .spot.active { background: #eef5f6; }
  .pill { color: #fff; border-radius: 99px; padding: 0 .6rem; font-size: .8rem; font-weight: 600; white-space: nowrap; background: var(--c); }
  .report-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .badge { background: var(--c); color: #fff; border-radius: 10px; padding: .7rem 1.1rem; text-align: center; min-width: 150px; }
  .badge b { display: block; font: 700 1.7rem var(--display); }
  .badge small { opacity: .9; }
  .message { border-left: 5px solid var(--c); padding: .6rem .9rem; background: #faf8f3; font-weight: 600; margin: .8rem 0 0; }
  .factor { padding: .65rem 0; border-bottom: 1px solid var(--line); }
  .factor:last-child { border: 0; }
  .factor-top { display: flex; justify-content: space-between; gap: 1rem; font-weight: 600; }
  .meter { height: 7px; background: #ece7dc; border-radius: 9px; margin: .35rem 0; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--high); }
  ul.checks { list-style: none; padding: 0; margin: 0; }
  ul.checks li { position: relative; padding-left: 1.6rem; margin: .45rem 0; }
  ul.checks li::before { content: ""; position: absolute; left: 0; top: .3rem; width: .95rem; height: .95rem; border: 2px solid var(--river); border-radius: 4px; }
  ol { padding-left: 1.2rem; margin: 0; } ol li { margin: .4rem 0; }
  .empty { text-align: center; color: var(--soft); padding: 3rem 1rem; }
  footer { max-width: 1160px; margin: 0 auto; padding: 0 1.25rem 2rem; font-size: .85rem; color: var(--soft); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="brand">

  </div>

      <ul class="spots" id="spots"></ul>

  <section id="report" aria-live="polite"></section>
</main>
<footer id="footer"></footer>

function scoreSite(s) {
  const factors = [];
  const fema = RULES.fema.find((lv) => lv.match.some((m) => s.fema.includes(m)));
  if (fema) factors.push({ label: "FEMA flood zone", points: fema.points, max: 4, text: fema.text });
  const h = RULES.height.find((lv) => s.height < lv.below);
  factors.push({
    label: "Height above the lowest nearby ground", points: h.points, max: 4,
    text: `${h.points === 4 ? "Only " : ""}${s.height.toFixed(1)} m above the lowest nearby ground.`,
  });
  const w = RULES.highWater.find((lv) => s.hwmKm <= lv.within);
  factors.push({
    label: "July 2025 high-water mark nearby", points: w.points, max: 2,
    text: s.hwmKm <= 2
      ? `A July 2025 high-water mark was surveyed ${s.hwmKm < 1 ? Math.round(s.hwmKm * 1000) + " m" : s.hwmKm.toFixed(1) + " km"} away.`
      : "No July 2025 high-water mark within 2 km.",
  });
  const points = factors.reduce((t, f) => t + f.points, 0);
  const available = factors.reduce((t, f) => t + f.max, 0);
  const band = RULES.bands.find((b) => points / available >= b.minShare);
  return { factors, points, available, band };
}

const el = (id) => document.getElementById(id);
const esc = (str) => String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
SITES.forEach((s) => { s.score = scoreSite(s); });
let activeTown = TEXT.allTowns;
let activeId = null;

function renderStatic() {
  el("brand-name").textContent = TEXT.brandName;
  el("tagline").textContent = TEXT.tagline;
  el("title").textContent = TEXT.title;
  el("lead").textContent = TEXT.lead;
  el("list-title").textContent = TEXT.listTitle;
  el("footer").textContent = TEXT.footer;
  el("legend").innerHTML = RULES.bands.map((b) => `<span style="--c:${b.color}">${b.name}</span>`).join("");
  const towns = [TEXT.allTowns, ...new Set(SITES.map((s) => s.town))];
  el("towns").innerHTML = towns.map((t) => `<button type="button" data-town="${esc(t)}" aria-pressed="${t === activeTown}">${esc(t)}</button>`).join("");
  el("towns").onclick = (e) => {
    const town = e.target.dataset.town;
    if (!town) return;
    activeTown = town;
    el("towns").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.town === town));
    renderMap(); renderList();
  };
}

function renderMap() {
  const shown = SITES.filter((s) => activeTown === TEXT.allTowns || s.town === activeTown);
  const W = 600, H = 300, pad = 40;
  const lons = shown.map((s) => s.lon), lats = shown.map((s) => s.lat);
  const kx = Math.cos((30 * Math.PI) / 180);
  let [x0, x1, y0, y1] = [Math.min(...lons), Math.max(...lons), Math.min(...lats), Math.max(...lats)];
  const spanX = Math.max((x1 - x0) * kx, 0.004), spanY = Math.max(y1 - y0, 0.004);
  const scale = Math.min((W - 2 * pad) / spanX, (H - 2 * pad) / spanY);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  const px = (s) => [W / 2 + (s.lon - cx) * kx * scale, H / 2 - (s.lat - cy) * scale];
  const r = activeTown === TEXT.allTowns ? 7 : 10;
  const labels = [...new Set(shown.map((s) => s.town))].map((t, i) => {
    const group = shown.filter((s) => s.town === t);
    const pts = group.map(px);
    const x = pts.reduce((a, p) => a + p[0], 0) / pts.length;
    const below = i % 2 === 1;
    const y = below ? Math.max(...pts.map((p) => p[1])) + r + 18 : Math.min(...pts.map((p) => p[1])) - r - 8;
    return `<text x="${x}" y="${y}" text-anchor="middle">${esc(t)}</text>`;
  });
  const dots = shown.map((s) => {
    const [x, y] = px(s);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${s.score.band.color}" data-id="${s.id}" class="${s.id === activeId ? "active" : ""}"><title>${esc(s.town)} · ${s.id} · ${s.score.band.name}</title></circle>`;
  });
  el("map").setAttribute("viewBox", `0 0 ${W} ${H}`);
  el("map").innerHTML = `<text x="${W - 12}" y="${H - 12}" text-anchor="end" style="font-weight:500;fill:#1f7a8c">${esc(TEXT.flowLabel)}</text>` + dots.join("") + labels.join("");
  el("map").onclick = (e) => { if (e.target.dataset.id) select(e.target.dataset.id); };
}

function renderList() {
  const shown = SITES.filter((s) => activeTown === TEXT.allTowns || s.town === activeTown);
  el("spots").innerHTML = shown.map((s) => `
    <li><button type="button" class="spot ${s.id === activeId ? "active" : ""}" data-id="${s.id}">
      <span>${esc(s.town)} · ${s.id}</span>
      <span class="pill" style="--c:${s.score.band.color}">${s.score.band.name}</span>
    </button></li>`).join("");
  el("spots").onclick = (e) => { const b = e.target.closest("button"); if (b) select(b.dataset.id); };
}

function renderReport() {
  const s = SITES.find((x) => x.id === activeId);
  if (!s) { el("report").innerHTML = `<div class="card empty">${esc(TEXT.emptyReport)}</div>`; return; }
  const sc = s.score, c = sc.band.color;
  el("report").innerHTML = `
    <div class="card">
      <div class="report-head">
        <div><p class="eyebrow">${esc(s.county)} · ${s.id}</p><h2>${esc(s.town)}, Guadalupe River</h2></div>
        <div class="badge" style="--c:${c}"><small>${esc(TEXT.riskLabel)}</small><b>${sc.band.name}</b><small>${esc(TEXT.pointsOf(sc.points, sc.available))}</small></div>
      </div>
      <p class="message" style="--c:${c}">${esc(TEXT.bandMessages[sc.band.name])}</p>
    </div>
    <div class="card">
      <h3>${esc(TEXT.whyTitle)}</h3>
      ${sc.factors.map((f) => `
        <div class="factor">
          <div class="factor-top"><span>${esc(f.label)}</span><span>${f.points}/${f.max}</span></div>
          <div class="meter"><i style="width:${(100 * f.points) / f.max}%"></i></div>
          <div>${esc(f.text)}</div>
        </div>`).join("")}
      <p class="small"><b>${esc(TEXT.notCheckedTitle)}:</b> ${RULES.notChecked.map(([a, b]) => `${esc(a)} (${esc(b)})`).join("; ")}</p>
    </div>
    <div class="card">
      <h3>${esc(TEXT.upstreamTitle)}</h3>
      <p>${esc(s.upstream ? TEXT.upstreamYes(s) : TEXT.upstreamNo(s))}</p>
    </div>
    <div class="card">
      <h3>${esc(TEXT.planTitle)}</h3>
      <ol>${TEXT.plan.map((p) => `<li>${esc(p)}</li>`).join("")}</ol>
    </div>
    <div class="card">
      <h3>${esc(TEXT.questionsTitle)}</h3>
      <ul class="checks">${TEXT.questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>
    </div>
    <div class="card">
      <h3>${esc(TEXT.photoTitle)}</h3>
      <p>${esc(s.notes)} <span class="small">(photo taken ${esc(s.date)})</span></p>
      <p><a href="${esc(s.noaa)}" target="_blank" rel="noopener">${esc(TEXT.photoLink)}</a></p>
    </div>`;
}

function select(id) {
  activeId = id;
  if (location.hash !== "#" + id.toLowerCase()) history.replaceState(null, "", "#" + id.toLowerCase());
  renderMap(); renderList(); renderReport();
  if (window.innerWidth < 820) el("report").scrollIntoView({ behavior: "smooth" });
}

function fromHash() {
  const id = location.hash.slice(1).toUpperCase();
  activeId = SITES.some((s) => s.id === id) ? id : null;
  renderMap(); renderList(); renderReport();
}

renderStatic();
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
